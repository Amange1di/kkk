services:
  - type: web
    name: edudata-backend
    env: python
    buildCommand: pip install -r requirements.txt && cd backend && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: cd backend && gunicorn edudata.wsgi:application --log-file - --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DEBUG
        value: false
        sync: false
      - key: SECRET_KEY
        generateValue: true
        sync: false
      - key: ALLOWED_HOSTS
        value: "*"
        sync: false
      - key: DB_ENGINE
        value: django.db.backends.postgresql
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-domain.onrender.com"
        sync: false
