services:
  - type: web
    name: edudata-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: python -m gunicorn --chdir backend edudata.wsgi:application --log-file - --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: false
        sync: false
      - key: SECRET_KEY
        generateValue: true
        sync: false
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
        sync: false
      - key: DB_ENGINE
        value: django.db.backends.postgresql
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-domain.onrender.com,https://kkk-vdxl.vercel.app"
        sync: false
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
        sync: false
