services:
  - type: web
    name: edudata-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --noinput && python manage.py migrate && DJANGO_SUPERUSER_USERNAME=admin DJANGO_SUPERUSER_EMAIL=admin@edudata.com DJANGO_SUPERUSER_PASSWORD=admin123 python manage.py createsuperuser --noinput
    startCommand: python -m gunicorn edudata.wsgi:application --log-file - --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: false
        sync: false
      - key: SECRET_KEY
        generateValue: true
        sync: false
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com,kkk-fwjw.onrender.com"
        sync: false
      - key: DB_ENGINE
        value: django.db.backends.postgresql
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-domain.onrender.com,https://kkk-vdxl.vercel.app"
        sync: false
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
        sync: false
